name: Notify search engines after publication
on:
  workflow_run:
    workflows: ['Static metadata checks']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-site-publication
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Notify IndexNow of changed published URLs
        continue-on-error: true
        run: node scripts/notify-indexnow.mjs --execute --changed-only --wait-published
